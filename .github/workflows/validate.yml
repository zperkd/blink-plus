name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Check frontend JavaScript syntax
        run: |
          node --check custom_components/blink_plus/frontend/blink-plus-ptt.js
          node --check custom_components/blink_plus/frontend/microphone-worklet.js
      - run: pip install pytest-homeassistant==2026.11.1 blinkpy==0.25.9 numpy==2.3.2 av==19.0.0 ha-ffmpeg==3.2.2 PyTurboJPEG==1.8.3
      - run: python -m unittest discover -s tests -v
      - run: pytest -q tests/ha --asyncio-mode=auto -p no:respx -o asyncio_default_fixture_loop_scope=function
        env:
          PYTHONPATH: .
  tests-latest-blinkpy:
    # Early warning: Home Assistant, not this project, chooses the installed blinkpy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant==2026.11.1 numpy==2.3.2 av==19.0.0 ha-ffmpeg==3.2.2 PyTurboJPEG==1.8.3
      - run: pip install --upgrade blinkpy
      - run: pip show blinkpy
      - run: python -m unittest discover -s tests -v
      - run: pytest -q tests/ha --asyncio-mode=auto -p no:respx -o asyncio_default_fixture_loop_scope=function
        env:
          PYTHONPATH: .
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
